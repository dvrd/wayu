name: Apply TigerStyle to Wayu
baseline: 121485099a0b2c629588d0ae8fe708b211ca7a42
roadmap: docs/tigerstyle-plan.md
evidence: docs/tigerstyle-review.md
usage: >
  Rounds schedule independent edits. Dependencies express prerequisites. File lists identify primary edit
  sites, including proposed files. Commands run from the repository root after implementing the task.
  New test selectors and benchmark options below must be implemented and actually exercise their named
  cases. Commands that need a PTY, platform, published tag or multiple runners specify that requirement.
  Group the publication tasks into one green, documented behavior change before merging to develop.
  Each behavior-changing PR also owns its upgrade note, applicable CLI/config reference and regenerated
  site files, even when these cross-cutting files are omitted from the primary edit sites below.
  A task with status done is merged and its done_when command passes. A pending task names the
  step that is left.
delivery_gates:
  - ./build_it check
  - ./build_it test
  - ./build_it integration
  - ./build_it docs && ./build_it docs --check
  - './build_it && WAYU_BIN="$PWD/bin/wayu" tests/benchmark/budget.sh'
tasks:
  - id: pub-files
    round: 1
    status: done
    title: Carry per-shell outcomes from required runtime file writers
    depends_on: []
    files: [src/init_generator.odin, src/turbo_export.odin, src/plugin_loader.odin, tests/unit/test_init_generator.odin]
    acceptance: >
      Distinguish written, current, intentionally skipped and failed artifacts. Retain enough owned data
      for a diagnostic after per-shell scratch is reset. Cover managed init, core, PATH sync, active turbo
      and applicable plugin text. Preserve customized orchestrators and optional bytecode behavior.
    done_when: ./build_it test test_wayu.test_publication_outcomes,test_wayu.test_publication_states_per_artifact,test_wayu.test_custom_init_template_preserved

  - id: perf-baseline
    round: 1
    status: done
    title: Establish a native-shell performance baseline
    depends_on: []
    files: [tests/benchmark/native_shell.py, docs/benchmarks.md, .github/workflows/startup-budget.yml]
    acceptance: >
      Add the new validated benchmark with smoke and repeated report modes. Run native interactive cases
      in a real PTY. Collect first prompt, key-to-redraw p50/p95, paste/undo, history variants, repeated
      live commands, fresh-process streaming/capture and memory observations. Verify contents, byte counts
      and exit status. Save raw distributions, feature flags, revision, toolchain, OS, runner and binary
      hashes. Keep the existing host-shell threshold. Provide a check-report mode for later calibration.
    done_when: ./build_it && python3 tests/benchmark/native_shell.py --binary ./bin/wayu --smoke

  - id: contributor-examples
    round: 1
    status: done
    title: Align contributor examples with terminal and test-scratch ownership
    depends_on: []
    files: [CODE_STYLE.md]
    acceptance: >
      All parent-process exit examples use wayu_exit. Forked children keep their own exit semantics.
      Scratch examples use test_tmp and each changed example matches the actual Odin API.
    done_when: >-
      ! rg -n 'os\.exit\(|"/tmp/wayu-test-file"' CODE_STYLE.md &&
      ./build_it test test_wayu.test_no_bare_os_exit

  - id: watch-clock
    round: 1
    status: done
    title: Use monotonic elapsed time for the watcher debounce
    depends_on: []
    files: [src/hot_reload.odin, tests/unit/test_hot_reload.odin]
    acceptance: >
      Deterministically test just below and at the deadline, resetting on a second event, retaining pending
      secret invalidation and a forward/back wall-clock step. Keep the current 500 ms debounce.
    done_when: ./build_it test test_wayu.test_watch_debounce_monotonic,test_wayu.test_watch_detects_changes_across_wall_clock_steps,test_wayu.test_watch_detects_created_and_deleted_files

  - id: pub-cli
    round: 2
    status: done
    title: Define and reproduce the public entry and build contract
    depends_on: [pub-files]
    files: [src/main.odin, src/entries.odin, src/path.odin, src/constants.odin, tests/integration/test_publication.rb]
    acceptance: >
      Begin with the red Bash obstruction test. Explicit build/init and alias, constant and PATH mutations
      distinguish failed storage from failed publication. Proposed code 74 covers required output I/O.
      Keep config errors including malformed plugin metadata at 78. Check stream content, existing custom
      init, two initialized shells, success after repair, dry run and initialization-free native sessions.
      Include test runner entry/config/repair groups for the other callers in this merge batch.
    done_when: ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_publication.rb --group entry

  - id: crash-seam
    round: 2
    status: done
    title: Synchronize a separate test build at the actual rename boundaries
    depends_on: [pub-files]
    files: [src/atomic_io.odin, tests/scenarios/publication_phases.rb]
    acceptance: >
      Compile hooks only into a dedicated binary. Select the exact entries or core target, announce
      before/after rename, and wait on a harness-owned channel. Add a timeout with child cleanup.
      The harness self-test checks the named target is reached and ordinary binaries ignore the controls.
    done_when: ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/scenarios/publication_phases.rb --self-test

  - id: capture-account
    round: 2
    status: done
    title: Attribute substitution allocations and eliminate avoidable copies
    depends_on: [perf-baseline]
    files: [src/native_bindings.odin, src/native_shell.odin, tests/unit/test_native_bindings.odin, tests/benchmark/native_shell.py]
    acceptance: >
      Add test/benchmark accounting for input bytes, peak retained capacity, scratch that overlaps during
      resize, expansion, assignment copies and release. Probe plain, quoted, concatenated, nested and
      repeated substitutions. Use counters to justify copy reductions while preserving expansion, newline
      trimming and child status. Report Darwin wait4 RSS with its descendant caveat.
    done_when: >-
      ./build_it test test_wayu.test_capture_accounting &&
      ./build_it && python3 tests/benchmark/native_shell.py --binary ./bin/wayu --capture-accounting

  - id: editor-storage
    round: 2
    status: done
    title: Bound the cost of ordinary typing and redraw
    depends_on: [perf-baseline]
    files: [src/native_editor.odin, tests/unit/test_native_editor.odin, tests/integration/native_shell_pty.odin]
    acceptance: >
      Replace whole-line undo snapshots with mutable text and reversible edits. Give render temporaries
      one redraw lifetime. Provide accounting and an injectable undo/redo capacity for tests. Preserve
      cursor positions, ordering, multiline input and single-step undo. Check linear retained edit bytes at
      1,024 and 4,096 insertions, one-step paste, redo invalidation, UTF-8 motion and clean terminal exit.
    done_when: >-
      ./build_it test test_wayu.test_edit_storage_growth,test_wayu.test_edit_redo_is_released_by_a_new_edit,test_wayu.test_edit_undo_restores_multibyte_and_multiline_text,test_wayu.test_edit_undo_limit_evicts_oldest_edits,test_wayu.test_editor_moves_across_utf8 &&
      ./build_it integration integration.native_editor_undo_paste

  - id: history-reader
    round: 2
    status: done
    title: Introduce streaming readers and an injectable recent-history window
    depends_on: [perf-baseline]
    files: [src/native_history.odin, tests/unit/test_native_history.odin]
    acceptance: >
      Count both bytes and records, bound partial-record scratch, and retain the last complete native
      offset through partial appends, rotation and truncation. Preserve locking, private leading-space
      handling and foreign shell multiline decoding. Handle an oversized record without removing it from
      disk. Keep existing visible recall until the paging consumer is ready.
    done_when: >-
      ./build_it test test_wayu.test_history_window_limits,test_wayu.test_history_append_replaces_partial_tail,test_wayu.test_history_oversized_record_stays_on_disk,test_wayu.test_history_two_sessions_share_one_file,test_wayu.test_foreign_history_decodes_each_shell_format,test_wayu.test_foreign_history_window_limits,test_wayu.test_history_hides_space_prefixed_records

  - id: pub-managers
    round: 3
    status: done
    title: Surface publication results from config tools and the file watcher
    depends_on: [pub-cli, watch-clock]
    files: [src/config_command.odin, src/optimize.odin, src/templates.odin, src/doctor.odin, src/hot_reload.odin]
    acceptance: >
      Classify every regeneration caller in these modules. Propagate unsatisfied required writes to the
      caller, preserve doctor’s documented aggregation/status, and keep the watcher alive with a useful
      diagnostic. Check repair of the obstruction followed by a new change. Retain dry-run behavior.
    done_when: ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_publication.rb --group config

  - id: pub-repairs
    round: 3
    status: done
    title: Preserve completed work and recovery evidence in repair callers
    depends_on: [pub-cli]
    files: [src/backup.odin, src/secrets_store.odin, src/script.odin, src/plugin_restore.odin]
    acceptance: >
      Deal explicitly with failed runtime publication after restore, secret changes and script-bin changes.
      Preserve valid canonical files, keys and rekey recovery state. Avoid retrying previously performed
      external actions. Keep secret values out of diagnostics. Verify a fresh process can repair the
      runtime with build and that the existing rekey cases pass.
    done_when: >-
      ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_publication.rb --group repair &&
      WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_plugin_restore.rb &&
      WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_secrets_store.rb

  - id: history-recall
    round: 3
    status: done
    title: Preserve access to old commands outside the resident window
    depends_on: [history-reader, editor-storage]
    files: [src/native_history.odin, src/native_editor.odin, src/native_suggest.odin, tests/integration/native_shell_pty.odin]
    acceptance: >
      Add on-demand up/down and Ctrl-R recall, keeping a selected line editable without executing it.
      Page old records across rotation and simultaneous sessions. Preserve suggestion-only external
      sources and ranking. Test retrieval of a record larger than the resident window and distinguish
      the selected line's storage from retained history.
    done_when: ./build_it integration integration.native_history_paging,integration.native_history_sessions,integration.native_autosuggestions

  - id: entry-model
    round: 3
    status: done
    title: Check stored state against an independent ordered edit model
    depends_on: [pub-cli]
    files: [tests/scenarios/entry_model.rb, tests/integration/test_entry_model.rb]
    acceptance: >
      Generate valid alias and plain constant add/update/remove/dry-run traces. Compare the entire
      ordered store using an independent JSON reader after every acknowledged change. Probe a real
      initialized shell after rebuild. Preserve all earlier acknowledged edits in the expected state.
      Record enough metadata and operations to rerun a failing trace.
    done_when: ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_entry_model.rb --seed 17

  - id: archive-pilot
    round: 3
    status: pending
    pending: >
      Run the workflow for v9.0.0 on a GitHub-hosted runner (gh workflow run rebuild-release.yml
      --ref develop -f tag=v9.0.0) and compare it with the emulated pilot in the roadmap. Add
      further targets only after the two agree.
    title: Independently rebuild one published Linux AMD64 archive
    depends_on: []
    files: [tests/release/rebuild_linux.sh, .github/workflows/rebuild-release.yml]
    acceptance: >
      Use a read-only job on a clean Ubuntu AMD64 runner. Select an explicit published tag with this
      packaging recipe, resolve its commit and verified compiler, rebuild the executable and normalized
      archive, and compare both layers with the published asset. Record compiler, linker, packaging tools
      and hashes. Self-test detection of changed payload and archive metadata. Any genuine mismatch
      stays visible and is investigated before expanding the job to further targets.
    done_when: 'tests/release/rebuild_linux.sh --self-test && tests/release/rebuild_linux.sh "${WAYU_REBUILD_TAG:?set an eligible published tag}"'

  - id: pub-contract
    round: 4
    status: done
    title: Complete the public documentation and end-to-end release checks in the publication PR
    depends_on: [pub-cli, pub-managers, pub-repairs]
    files: [docs/cli.md, docs/UPGRADING.md, tests/integration/exit_codes.odin, tests/integration/test_init.rb, tests/integration/test_write_integrity.rb]
    acceptance: >
      Verify the full matrix, including canonical-write failure, mixed shell outcomes, saved alias,
      fresh-shell observations, custom init, standalone and repeated repair. Audit remaining direct
      regeneration callers and prevent an unconditional success message after required failure.
      Keep exit-code reference examples executable and document the changed status under Unreleased.
    done_when: >-
      ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_publication.rb --group all &&
      WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_write_integrity.rb &&
      WAYU_BIN="$PWD/bin/wayu" ./build_it integration integration.exit_codes && ./build_it docs --check

  - id: budget-policy
    round: 4
    status: done
    title: Select each budget's scope, default and exhaustion behavior from evidence
    depends_on: [capture-account, editor-storage, history-recall]
    files: [docs/benchmarks.md, docs/evidence/native-resources.json]
    acceptance: >
      Publish repeated Linux/macOS results and record tradeoffs for capture, retained undo/redo and
      history bytes/entries. Validate 32 or more samples per published workload per run and keep raw
      samples available. Specify accounting for forks, oversized records, redo, release points and
      user overrides. Prefer opt-in hard capture/undo limits if representative data cannot justify a
      breaking default. Deterministic byte checks may gate CI immediately; timing gates need calibration.
    done_when: python3 tests/benchmark/native_shell.py --check-report docs/evidence/native-resources.json

  - id: native-oracle
    round: 4
    status: done
    title: Model a small part of native shell semantics and pin job-record eviction
    depends_on: []
    files: [tests/integration/test_native_model.rb, tests/unit/test_native_jobs.odin, tests/integration/native_pipeline_failures.odin]
    acceptance: >
      Start with literals, bounded arithmetic, simple handler contexts and known child exit statuses.
      Check status, stdout and stderr from command strings and script files against Wayu's documented
      semantics. Distinguish deliberate exit 141 from OS-reported SIGPIPE. Test retention around
      255/256/257 completed records independently of active job count. Print replayable reduced traces.
    done_when: >-
      ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_native_model.rb --seed 17 &&
      ./build_it test test_wayu.test_completed_job_eviction,test_wayu.test_completed_job_eviction_keeps_newest_results &&
      WAYU_BIN="$PWD/bin/wayu" ./build_it integration integration.native_pipeline_failures

  - id: capture-limit
    round: 5
    status: done
    title: Apply the chosen capture budget and preserve streaming pipelines
    depends_on: [budget-policy]
    files: [src/native_bindings.odin, src/native_shell.odin, src/native_config.odin, tests/integration/native_capture_budget.odin, docs/cli.md]
    acceptance: >
      Enforce the selected policy before a partial expansion can reach its consuming command. Distinguish
      raw output bytes before trimming from allocated capacity. Handle exact limits, one-byte overflow,
      the read-buffer boundary, nested captures, interruption and a producer that writes indefinitely.
      Cancel/reap owned work safely, preserve unrelated jobs and allow the next command to run. No
      automatic replay of earlier pipeline stages. Include a larger streaming-pipeline control.
    done_when: ./build_it integration integration.native_capture_budget,integration.native_capture_default,integration.native_pipeline_failures

  - id: crash-replay
    round: 5
    status: done
    title: Enumerate crash phases and verify recovery against the model
    depends_on: [crash-seam, entry-model, pub-contract]
    files: [tests/scenarios/publication_phases.rb, tests/scenarios/entry_model.rb, tests/integration/test_publication_recovery.rb, .github/workflows/failure-campaign.yml]
    acceptance: >
      First enumerate one edit at each phase; then run seeded sequences and two initialized shells.
      Assert old/new state according to the observed rename phase, agreement with all earlier
      acknowledged edits, two successful repairs, host-shell observations and one subsequent edit.
      Retain the current OS lock, kill and Linux ENOSPC campaign. Save phase trace, seed, versions,
      binary digest and first difference. Run short fixed traces on PRs and add an extended seed mode
      to workflow_dispatch. Introduce a schedule once its cost is measured.
    done_when: >-
      ./build_it && WAYU_BIN="$PWD/bin/wayu" ruby tests/integration/test_publication_recovery.rb --all-phases --seed 17 &&
      WAYU_BIN="$PWD/bin/wayu" ruby tests/scenarios/failure_campaign.scenario.test.rb

  - id: retention-defaults
    round: 6
    status: done
    title: Wire measured history and undo limits into normal interactive sessions
    depends_on: [history-recall, budget-policy, capture-limit]
    files: [src/native_config.odin, src/toml.odin, docs/config-reference.md, docs/UPGRADING.md, tests/integration/native_retention_budgets.odin]
    acceptance: >
      Use the resource configuration path introduced by capture-limit. Wire the chosen thresholds into
      the already-tested storage implementations, including both count and byte limits where relevant.
      Document keys and units if exposed. Check default and configured behavior in a fresh home,
      a long-running session and a pre-existing history. A user-visible policy change ships with
      its docs and upgrade notes in the same PR. Re-run the native benchmark against the baseline.
    done_when: >-
      ./build_it integration integration.native_retention_budgets,integration.native_retention_defaults,integration.native_limit_validation,integration.native_history_paging &&
      ./build_it && python3 tests/benchmark/native_shell.py --binary ./bin/wayu --smoke && ./build_it docs --check
