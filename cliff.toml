[changelog]
header = """
# Changelog

All notable changes to wayu will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Behavior changes per release: [docs/UPGRADING.md](docs/UPGRADING.md).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% set breaking = commits | filter(attribute="breaking", value=true) %}\
{% if breaking %}
### ⚠ Upgrade notes
{% for commit in breaking %}\
{#- The whole BREAKING CHANGE footer, to the end of the message. The parsed
    commit.breaking_description stops at the first wrapped line that looks
    like a footer token ("`$NAME:x`", "functions/:"), cutting notes
    mid-sentence. Wrapped lines stay in the bullet (Markdown lazy
    continuation; `trim` strips any indentation). #}\
{% set raw = commit.raw_message | replace(from="BREAKING-CHANGE: ", to="BREAKING CHANGE: ") %}\
{% if raw is containing("BREAKING CHANGE: ") %}\
{% set note = raw | split(pat="BREAKING CHANGE: ") | last | trim %}\
{% else %}\
{% set note = commit.message %}\
{% endif %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ note | upper_first }}\
{% endfor %}
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = """
{% for release in releases %}\
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/dvrd/wayu/releases/tag/{{ release.version }}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/dvrd/wayu/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat",     group = "Added" },
  { message = "^fix",      group = "Fixed" },
  { message = "^refactor", group = "Changed" },
  { message = "^perf",     group = "Changed" },
  { message = "^docs",     group = "Documentation", skip = true },
  { message = "^test",     group = "Internal",      skip = true },
  { message = "^ci",       group = "Internal",      skip = true },
  { message = "^chore",    group = "Internal",      skip = true },
  { message = "^revert",   group = "Reverted" },
]
# Breaking commits are never skipped, even ci!/chore! ones: they drive the
# major bump and the "Upgrade notes" section.
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[bump]
# Semver from Conventional Commits: `type!:` or a `BREAKING CHANGE:` footer
# → major, `feat:` → minor, anything else → patch. A user-visible behavior
# change must be marked breaking (see AGENTS.md "Commit convention").
features_always_bump_minor = true
breaking_always_bump_major = true
