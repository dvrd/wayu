name: CI

# Pushes to main do not trigger this workflow directly: bump.yml calls it
# (workflow_call) and releases only if every job here passes.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-campaign:
    name: Failure campaign
    uses: ./.github/workflows/failure-campaign.yml

  ecosystem:
    name: Pinned upstream compatibility
    uses: ./.github/workflows/ecosystem.yml
    with:
      benchmarks: false

  upgrade:
    name: Previous-release upgrade on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-odin
    - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: '3.3'
    - name: Install shells (Linux)
      if: runner.os == 'Linux'
      run: .github/scripts/apt-install.sh zsh fish
    - name: Install fish (macOS)
      if: runner.os == 'macOS'
      run: brew install fish
    - name: Build candidate
      run: |
        odin build build -out:build_it
        ./build_it build
    - name: Download and verify latest published release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version=$(gh release view --repo dvrd/wayu --json tagName --jq .tagName)
        echo "Upgrade baseline: $version" >> "$GITHUB_STEP_SUMMARY"
        mkdir -p "$RUNNER_TEMP/wayu-previous-home"
        HOME="$RUNNER_TEMP/wayu-previous-home" \
          WAYU_VERSION="$version" WAYU_INSTALL_DIR="$RUNNER_TEMP/wayu-previous" \
          sh docs/install.sh < /dev/null
    - name: Upgrade previous binary to candidate in all shells
      env:
        WAYU_PREVIOUS_BIN: ${{ runner.temp }}/wayu-previous/wayu
        WAYU_BIN: bin/wayu
      run: ruby tests/release/upgrade.rb

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    - name: Setup Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: '3.3'

    # Integration tests syntax-check and source the generated init files with
    # real shells. macOS ships zsh + bash; fish is needed everywhere.
    - name: Install shells (Linux)
      if: runner.os == 'Linux'
      # Retries, archive.ubuntu.com, then Homebrew (see the script).
      run: .github/scripts/apt-install.sh zsh fish

    - name: Install shells (macOS)
      if: runner.os == 'macOS'
      run: brew install fish

    - name: Show shells
      run: |
        zsh --version
        bash --version | head -1
        fish --version

    - name: Bootstrap build script
      run: odin build build -out:build_it

    - name: Build wayu
      run: ./build_it build

    - name: Verify build
      run: ./bin/wayu --version

    # Release binaries must start on macOS >= .github/macos-minimum-version.
    - name: Check macOS minimum version
      if: runner.os == 'macOS'
      run: .github/scripts/check-macos-minos.sh bin/wayu

    # ./build_it test sandboxes HOME and the tests' scratch dirs (per run),
    # same as local runs. Leaks / bad frees (tracking allocator) fail it.
    - name: Run unit tests
      shell: bash
      run: |
        mkdir -p evidence
        ./build_it test 2>&1 | tee evidence/unit-tests.txt

    - name: Upload unit-test stdout on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit-tests-stdout-${{ matrix.os }}
        path: bin/unit-tests.stdout.log
        if-no-files-found: ignore

    - name: Run integration tests (incl. golden)
      shell: bash
      # The candidate was built and verified above. Reuse that exact binary
      # instead of recompiling it in every suite (the ASan job does the same).
      env:
        WAYU_BIN: bin/wayu
      run: |
        mkdir -p evidence
        ruby tests/integration/run_all.rb 2>&1 | tee evidence/integration.txt

    - name: Run TUI layout tests (pyte)
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/tui-venv"
        "$RUNNER_TEMP/tui-venv/bin/pip" install --quiet --require-hashes \
          --no-deps -r .github/tui-requirements.txt
        "$RUNNER_TEMP/tui-venv/bin/python" tests/tui/test_responsive.py 2>&1 | tee evidence/tui.txt

    - name: Record security source manifest
      run: |
        ruby tests/release/security_evidence.rb --manifest-only > evidence/security-sources.txt

    - name: Keep test and review evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-evidence-${{ matrix.os }}
        path: evidence/
        if-no-files-found: warn

  # Integration suites against an AddressSanitizer build: catches
  # use-after-free / out-of-bounds in the real CLI paths. Leak detection is
  # off (a CLI process intentionally leaves memory to exit); unit tests cover
  # leaks with the tracking allocator.
  sanitize:
    name: AddressSanitizer (integration)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    - name: Setup Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: '3.3'

    - name: Install shells
      # Retries, archive.ubuntu.com, then Homebrew (see the script).
      run: .github/scripts/apt-install.sh zsh fish

    - name: Bootstrap build script
      run: odin build build -out:build_it

    - name: Build wayu (regular + ASan)
      run: |
        ./build_it build
        mkdir -p bin/asan
        odin build src -out:bin/asan/wayu -sanitize:address -debug

    - name: Run integration tests (ASan)
      env:
        WAYU_BIN: bin/asan/wayu
        ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=0:disable_coredump=0
      run: ruby tests/integration/run_all.rb

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    - name: Build with warnings as errors
      run: |
        mkdir -p bin
        odin build src -out:bin/wayu -vet -warnings-as-errors -o:speed

  release-check:
    name: Release Readiness
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    # README.md + docs/index.html must advertise VERSION from src/main.odin, and
    # the generated docs pages must match docs/*.md (build/site.odin).
    # bump.yml and ./build_it release run `./build_it docs` to keep them in sync.
    - name: Check version consistency
      run: |
        odin build build -out:build_it
        ./build_it docs --check

    - name: Check required files exist
      run: |
        for f in README.md docs/index.html docs/UPGRADING.md .github/workflows/bump.yml \
          .github/scripts/homebrew-formula.sh .github/scripts/release-notes.sh \
          .github/scripts/upgrading-version.sh .github/scripts/check-macos-minos.sh \
          .github/scripts/apt-install.sh .github/workflows/release-build.yml \
          .github/macos-minimum-version docs/install.sh; do
          [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
        done
        echo "All required files present"

    - name: Check formula generator
      run: |
        A=$(printf 'a%.0s' {1..64}); B=$(printf 'b%.0s' {1..64})
        C=$(printf 'c%.0s' {1..64}); D=$(printf 'd%.0s' {1..64})
        .github/scripts/homebrew-formula.sh v0.0.0 "$A" "$B" "$C" "$D" > /tmp/wayu.rb
        ruby -c /tmp/wayu.rb
        # init.<ext> lives in the data dir since 6.0.0; caveats must not
        # point new users at the old ~/.config/wayu/init.<ext>.
        if grep -n '\.config/wayu/init' /tmp/wayu.rb; then
          echo "::error::Formula caveats name ~/.config/wayu/init.*; use the data dir"
          exit 1
        fi
        # shellcheck disable=SC2016 # a literal $HOME in the formula text
        grep -q 'XDG_DATA_HOME:-\$HOME/.local/share}/wayu}/init.zsh' /tmp/wayu.rb || {
          echo "::error::Formula caveats lack the data-dir init.zsh line"
          exit 1
        }
        # One archive per platform, each with its own checksum.
        for asset in wayu-macos-arm64 wayu-macos-amd64 wayu-linux-amd64 wayu-linux-arm64; do
          grep -q "/$asset.tar.gz\"" /tmp/wayu.rb || {
            echo "::error::Formula has no url for $asset"
            exit 1
          }
        done
        [ "$(grep -cE 'sha256 "[a-d]{64}"' /tmp/wayu.rb)" = 4 ] || {
          echo "::error::Formula must carry 4 distinct sha256 lines"
          exit 1
        }

  # The release binaries for all four targets (linux amd64/arm64, macOS
  # arm64/x86_64), built exactly as bump.yml builds them and smoke-tested on
  # each platform; nothing is published. A broken target fails here, not at
  # release time.
  release-build:
    name: Release build
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      artifact-prefix: ci-

  # docs/install.sh (served at https://wayu.dvrd.io/install.sh) against the
  # latest published release, as `curl ... | sh` runs it, in an empty HOME.
  install-script:
    name: Install script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read   # gh attestation verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Lint install.sh
      if: runner.os == 'Linux'
      run: shellcheck -s sh docs/install.sh

    - name: Install the latest release in an empty HOME
      env:
        # gh is on the runner: the script also verifies the attestation.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        home=$(mktemp -d)
        export HOME="$home"
        unset XDG_CONFIG_HOME XDG_DATA_HOME WAYU_CONFIG_DIR WAYU_DATA_DIR
        sh docs/install.sh < /dev/null
        "$home/.local/bin/wayu" --version
        "$home/.local/bin/wayu" doctor

    # A curl shim in front of the real one rewrites the downloaded .sha256.
    - name: A tampered checksum fails the install
      run: |
        set -euo pipefail
        home=$(mktemp -d)
        shim=$(mktemp -d)
        real_curl=$(command -v curl)
        cat > "$shim/curl" <<SHIM
        #!/bin/sh
        "$real_curl" "\$@" || exit \$?
        out=; prev=
        for a in "\$@"; do [ "\$prev" = -o ] && out=\$a; prev=\$a; done
        case "\$out" in *.sha256) printf '%064d  tampered\\n' 0 > "\$out" ;; esac
        SHIM
        chmod +x "$shim/curl"
        if HOME="$home" PATH="$shim:$PATH" sh docs/install.sh < /dev/null; then
          echo "::error::install.sh accepted a tampered sha256"
          exit 1
        fi
        [ ! -e "$home/.local/bin/wayu" ] || {
          echo "::error::install.sh left a binary behind after a checksum failure"
          exit 1
        }
