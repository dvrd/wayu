name: CI

# Pushes to main do not trigger this workflow directly: bump.yml calls it
# (workflow_call) and releases only if every job here passes.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    # Integration tests syntax-check and source the generated init files with
    # real shells. macOS ships zsh + bash; fish is needed everywhere.
    - name: Install shells (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq zsh fish

    - name: Install shells (macOS)
      if: runner.os == 'macOS'
      run: brew install fish

    - name: Show shells
      run: |
        zsh --version
        bash --version | head -1
        fish --version

    - name: Bootstrap build script
      run: odin build build -out:build_it

    - name: Build wayu
      run: ./build_it build

    - name: Verify build
      run: ./bin/wayu --version

    # ./build_it test sandboxes HOME, same as local runs.
    - name: Run unit tests
      run: ./build_it test

    - name: Run integration tests (incl. golden)
      run: ruby tests/integration/run_all.rb

    - name: Run TUI layout tests (pyte)
      run: |
        python3 -m venv "$RUNNER_TEMP/tui-venv"
        "$RUNNER_TEMP/tui-venv/bin/pip" install --quiet pyte
        "$RUNNER_TEMP/tui-venv/bin/python" tests/tui/test_responsive.py

    - name: Test CLI exit codes
      run: |
        EXIT_CODE=0
        ./bin/wayu path add > /dev/null 2>&1 || EXIT_CODE=$?
        if [ "$EXIT_CODE" -eq 64 ]; then
          echo "CLI returns correct exit code 64 for missing args"
        else
          echo "Expected exit code 64, got $EXIT_CODE"
          exit 1
        fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Odin
      uses: ./.github/actions/setup-odin

    - name: Build with warnings as errors
      run: |
        mkdir -p bin
        odin build src -out:bin/wayu -warnings-as-errors -o:speed

  release-check:
    name: Release Readiness
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check version consistency
      run: |
        VERSION=$(grep '^VERSION ::' src/main.odin | sed 's/VERSION :: "\(.*\)"/\1/')
        if [ -z "$VERSION" ]; then
          echo "Could not extract version from src/main.odin"
          exit 1
        fi
        echo "Version: $VERSION"

    - name: Check required files exist
      run: |
        for f in README.md docs/index.html .github/workflows/bump.yml .github/scripts/homebrew-formula.sh; do
          [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
        done
        echo "All required files present"

    - name: Check formula generator
      run: |
        A=$(printf 'a%.0s' {1..64}); B=$(printf 'b%.0s' {1..64})
        .github/scripts/homebrew-formula.sh v0.0.0 "$A" "$B" > /tmp/wayu.rb
        ruby -c /tmp/wayu.rb
