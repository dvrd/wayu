name: Bump Version & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (auto = detect from commits)'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

# Serialize all runs of this workflow so two releases never race on tags or
# on the tap push. Note: the bot's `chore: release` commit is pushed with
# GITHUB_TOKEN, which does NOT trigger another run. Republish mode only
# happens when a human pushes a `chore: release vX.Y.Z` commit
# (./build_it release) or a run is re-run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Full CI (unit + integration + golden + lint) gates every release.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      attestations: read   # ci.yml's install-script job (gh attestation verify)

  bump:
    name: Bump version
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      mode: ${{ steps.version.outputs.MODE }}
      skip: ${{ steps.version.outputs.SKIP }}

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
        fetch-tags: true            # fetch ALL tags, including orphans whose commits aren't on main
        # The write token is NOT left in .git/config for every later step
        # (git-cliff, odin, ./build_it): only "Commit and tag" gets it, via
        # env, for its push. Fetches are anonymous (public repo).
        persist-credentials: false

    # Pinned prebuilt release, checksum-verified (was: an unpinned
    # `cargo install`, compiled from source in two jobs per release). The
    # release notes are generated in this job too, so it is the only install.
    - name: Install git-cliff
      env:
        # ./build_it release reads this line and refuses any other git-cliff.
        CLIFF_VERSION: 2.9.1
        CLIFF_SHA256: 532a89577230128d7df74d912843d561aea2660e280ebd0ed92f24c972438f1c
      run: |
        set -euo pipefail
        name="git-cliff-${CLIFF_VERSION}"
        curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
          "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${name}-x86_64-unknown-linux-gnu.tar.gz"
        echo "${CLIFF_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/$name/git-cliff" /usr/local/bin/git-cliff
        git cliff --version

    # Decides what to do and refuses anything unsafe. This step never deletes
    # or moves a tag or release; on any inconsistency it fails with a
    # message describing the manual fix.
    - name: Determine action
      id: version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BUMP_TYPE: ${{ inputs.bump_type }}
      run: |
        set -euo pipefail
        git fetch --tags --force origin
        git fetch origin main

        emit() {
          {
            echo "VERSION=$1"
            echo "MODE=$2"
            if [ "$2" = "skip" ]; then echo "SKIP=true"; else echo "SKIP=false"; fi
          } >> "$GITHUB_OUTPUT"
        }

        HEAD_OID=$(git rev-parse HEAD)
        MAIN_OID=$(git rev-parse origin/main)

        # A re-run of an old run (or a run queued behind a newer push) must not
        # compute a version from a stale HEAD. The run for the current tip
        # releases everything since the last tag.
        if [ "$HEAD_OID" != "$MAIN_OID" ]; then
          echo "::notice::$HEAD_OID is no longer the tip of main ($MAIN_OID) — skipping; the run for the tip will release."
          emit "" skip
          exit 0
        fi

        HEAD_MSG=$(git log -1 --format=%s)
        HEAD_VERSION=$(echo "$HEAD_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)

        # Modes:
        #   bump      — fresh commits since last tag. Edit VERSION + CHANGELOG,
        #               commit, tag, atomic push.
        #   republish — HEAD is "chore: release vX.Y.Z" (./build_it release, or
        #               a prior run that committed but didn't finish). Tag HEAD
        #               if needed and (re)publish.
        #   skip      — nothing to release.
        if [ -n "$HEAD_VERSION" ] && [ "$HEAD_MSG" = "chore: release $HEAD_VERSION" ]; then
          VERSION="$HEAD_VERSION"
          MODE="republish"
          # The tag must name what the binary reports: refuse a release
          # commit whose src/main.odin VERSION is another version.
          SRC_VERSION=$(sed -n 's/^VERSION :: "\([^"]*\)".*/\1/p' src/main.odin | head -1)
          if [ "v$SRC_VERSION" != "$VERSION" ]; then
            echo "::error::HEAD is 'chore: release $VERSION' but src/main.odin has VERSION :: \"$SRC_VERSION\". Fix VERSION (./build_it release) before releasing."
            exit 1
          fi
        else
          if [ -n "$BUMP_TYPE" ] && [ "$BUMP_TYPE" != "auto" ]; then
            VERSION=$(git cliff --bumped-version --bump "$BUMP_TYPE")
          else
            VERSION=$(git cliff --bumped-version)
          fi
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "::notice::No releasable commits since $CURRENT."
            emit "$VERSION" skip
            exit 0
          fi
          MODE="bump"
        fi

        if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Computed version '$VERSION' is not vX.Y.Z"
          exit 1
        fi

        # Never go backwards: the new version must be >= the highest tag.
        HIGHEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
        if [ -n "$HIGHEST" ] && [ "$VERSION" != "$HIGHEST" ] \
          && [ "$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | tail -1)" != "$VERSION" ]; then
          echo "::error::Refusing to release $VERSION: it is lower than existing tag $HIGHEST."
          exit 1
        fi

        # Existing tag for this version: fine only if it already points at HEAD.
        # Anything else needs a human — never delete a tag or release here.
        if TAG_OID=$(git rev-parse -q --verify "refs/tags/$VERSION^{commit}"); then
          if [ "$MODE" = "republish" ] && [ "$TAG_OID" = "$HEAD_OID" ]; then
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "::notice::Tag and release for $VERSION already at HEAD — nothing to do."
              emit "$VERSION" skip
              exit 0
            fi
            echo "Tag $VERSION already at HEAD; release missing — will publish."
          else
            if gh release view "$VERSION" >/dev/null 2>&1; then
              RELEASE_NOTE="A published GitHub release exists for $VERSION."
            else
              RELEASE_NOTE="No GitHub release exists for $VERSION."
            fi
            echo "::error::Tag $VERSION already exists at $TAG_OID but HEAD is $HEAD_OID (mode=$MODE). $RELEASE_NOTE Not touching it."
            echo "If the tag is an orphan from an aborted run and has NO release, delete it manually:"
            echo "  git push origin :refs/tags/$VERSION"
            echo "Otherwise bump past it (workflow_dispatch with a bump_type, or ./build_it release <next>)."
            exit 1
          fi
        fi

        echo "::notice::Mode=$MODE  Version=$VERSION  HEAD=$(git rev-parse --short HEAD)"
        emit "$VERSION" "$MODE"

    - name: Update VERSION in src/main.odin
      if: steps.version.outputs.MODE == 'bump'
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        VERSION_BARE="${VERSION#v}"
        sed -i "s/VERSION :: \"[^\"]*\"/VERSION :: \"${VERSION_BARE}\"/" src/main.odin
        grep -q "VERSION :: \"${VERSION_BARE}\"" src/main.odin || { echo "::error::VERSION not updated"; exit 1; }

    - name: Setup Odin
      if: steps.version.outputs.MODE == 'bump'
      uses: ./.github/actions/setup-odin

    - name: Generate CHANGELOG
      if: steps.version.outputs.MODE == 'bump'
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: git cliff --tag "$VERSION" -o CHANGELOG.md

    # The release notes take their upgrade notes from this section.
    - name: Name the UPGRADING.md section
      if: steps.version.outputs.MODE == 'bump'
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: .github/scripts/upgrading-version.sh "$VERSION"

    # Same sync ./build_it release does; CI's Release Readiness job fails on
    # drift. After the UPGRADING.md rename: the docs pages are rendered from it.
    - name: Sync README + docs version, regenerate the docs pages
      if: steps.version.outputs.MODE == 'bump'
      run: |
        odin build build -out:build_it
        ./build_it docs
        ./build_it docs --check

    - name: Commit and tag
      if: steps.version.outputs.SKIP == 'false'
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        MODE: ${{ steps.version.outputs.MODE }}
        # The only step with the write token (checkout persists none).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Built here, never echoed; Actions masks the token in logs anyway.
        PUSH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

        if [ "$MODE" = "republish" ]; then
          # Determine action verified the tag is either absent or already at HEAD.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already at HEAD."
          else
            git tag "$VERSION"
            git push "$PUSH_URL" "refs/tags/$VERSION"
          fi
        else
          # bump: ship commit + tag atomically. If main moved meanwhile the push
          # is rejected and NEITHER ref updates; the run for the new tip retries.
          git add src/main.odin CHANGELOG.md README.md docs/index.html docs/UPGRADING.md docs/docs docs/sitemap.xml
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push --atomic "$PUSH_URL" main:refs/heads/main "refs/tags/$VERSION:refs/tags/$VERSION"
        fi

    # HEAD is the release tag now. Upgrade notes from its docs/UPGRADING.md
    # "## X.Y.Z" section (curated, complete), the rest from git-cliff.
    - name: Generate release notes
      if: steps.version.outputs.SKIP == 'false'
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/release-notes"
        git cliff --latest --strip header > "$RUNNER_TEMP/cliff_notes.md"
        .github/scripts/release-notes.sh "$VERSION" "$RUNNER_TEMP/cliff_notes.md" \
          > "$RUNNER_TEMP/release-notes/release_notes.md"
        cat "$RUNNER_TEMP/release-notes/release_notes.md"

    - name: Upload release notes
      if: steps.version.outputs.SKIP == 'false'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes/release_notes.md

  # Builds every target at the release tag and smoke-tests each archive on
  # its own platform (macOS x86_64: cross-compiled on arm64, run on an
  # Intel runner). The same workflow runs in CI on develop/PRs.
  build-release:
    name: Release build
    needs: bump
    if: needs.bump.outputs.skip == 'false'
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.bump.outputs.version }}
      version: ${{ needs.bump.outputs.version }}

  # Signed SLSA build provenance for each archive and the binary inside it:
  # `gh attestation verify <file> --repo dvrd/wayu` (see SECURITY.md).
  # Its own job so the signing permissions never reach the build steps; it
  # runs no repository code, only checks and unpacks the uploaded archives.
  attest:
    name: Attest ${{ matrix.artifact }}
    needs: [bump, build-release]
    if: needs.bump.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # Sigstore signing certificate for the attestation
      attestations: write   # store the build provenance attestation
    strategy:
      matrix:
        artifact: [wayu-linux-amd64, wayu-linux-arm64, wayu-macos-arm64, wayu-macos-amd64]

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ matrix.artifact }}
        path: dist

    - name: Check checksum and unpack the binary
      working-directory: dist
      env:
        ARTIFACT: ${{ matrix.artifact }}
      run: |
        set -euo pipefail
        sha256sum -c "$ARTIFACT.sha256"
        [ "$(tar -tzf "$ARTIFACT.tar.gz")" = "wayu" ] || {
          echo "::error::$ARTIFACT.tar.gz must hold exactly one entry, wayu"
          exit 1
        }
        mkdir -p bin
        tar -xzf "$ARTIFACT.tar.gz" -C bin wayu

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: |
          dist/${{ matrix.artifact }}.tar.gz
          dist/bin/wayu

  create-release:
    name: Create GitHub Release
    # Never publish an archive without its attestation.
    needs: [bump, build-release, attest]
    if: needs.bump.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    # The release's own artifacts only (CI's, from the same run, are ci-*).
    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wayu-*
        path: artifacts

    - name: Download release notes
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-notes
        path: artifacts/release-notes

    - name: Create Release
      # Updates an existing release at the same tag, so re-runs are idempotent.
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      with:
        tag_name: ${{ needs.bump.outputs.version }}
        name: wayu ${{ needs.bump.outputs.version }}
        # Written by the bump job (the one git-cliff install).
        body_path: artifacts/release-notes/release_notes.md
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          artifacts/wayu-linux-amd64/wayu-linux-amd64.tar.gz
          artifacts/wayu-linux-amd64/wayu-linux-amd64.sha256
          artifacts/wayu-linux-arm64/wayu-linux-arm64.tar.gz
          artifacts/wayu-linux-arm64/wayu-linux-arm64.sha256
          artifacts/wayu-macos-arm64/wayu-macos-arm64.tar.gz
          artifacts/wayu-macos-arm64/wayu-macos-arm64.sha256
          artifacts/wayu-macos-amd64/wayu-macos-amd64.tar.gz
          artifacts/wayu-macos-amd64/wayu-macos-amd64.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [bump, create-release]
    if: needs.bump.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    # TAP_GITHUB_TOKEN belongs in this environment's secrets (a fine-grained
    # PAT: dvrd/homebrew-wayu only, Contents read/write). Until it is moved
    # there the repository secret of the same name still applies.
    environment: release
    permissions:
      contents: read

    steps:
    - name: Checkout wayu (formula generator)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        ref: ${{ needs.bump.outputs.version }}
        path: wayu

    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: wayu-*
        path: artifacts

    - name: Checkout tap repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: dvrd/homebrew-wayu
        path: tap
        # Public repo: clone anonymously; only the push step gets the token.
        persist-credentials: false

    - name: Update formula
      env:
        VERSION: ${{ needs.bump.outputs.version }}
      run: |
        set -euo pipefail
        sha() { awk '{print $1}' "artifacts/$1/$1.sha256"; }

        # Never downgrade brew users (e.g. a re-run of an old release).
        FORMULA=tap/Formula/wayu.rb
        if [ -f "$FORMULA" ]; then
          OLD=$(sed -n 's/^  version "\(.*\)"/\1/p' "$FORMULA" | head -1)
          NEW="${VERSION#v}"
          if [ -n "$OLD" ] && [ "$OLD" != "$NEW" ] \
            && [ "$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "::error::Tap formula is at $OLD; refusing to downgrade to $NEW."
            exit 1
          fi
        fi

        mkdir -p tap/Formula
        wayu/.github/scripts/homebrew-formula.sh "$VERSION" \
          "$(sha wayu-macos-arm64)" "$(sha wayu-macos-amd64)" \
          "$(sha wayu-linux-amd64)" "$(sha wayu-linux-arm64)" > "$FORMULA.new"
        ruby -c "$FORMULA.new"
        if grep -n '\.config/wayu/init' "$FORMULA.new"; then
          echo "::error::Formula caveats name ~/.config/wayu/init.*; use the data dir"
          exit 1
        fi
        mv "$FORMULA.new" "$FORMULA"
        cat "$FORMULA"

    - name: Commit and push formula
      working-directory: tap
      env:
        VERSION: ${{ needs.bump.outputs.version }}
        TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/wayu.rb
        # Tolerate "nothing to commit" so re-runs don't fail when the formula
        # already has the right version + SHAs.
        if git diff --cached --quiet; then
          echo "Formula already up-to-date for $VERSION — nothing to push."
        else
          git commit -m "wayu $VERSION"
          branch=$(git symbolic-ref --short HEAD)
          git push "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/dvrd/homebrew-wayu.git" \
            "HEAD:refs/heads/$branch"
        fi
