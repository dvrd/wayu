name: Bug report
description: wayu does something wrong, crashes, or breaks your shell startup
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Don't file it here — see [SECURITY.md](https://github.com/dvrd/wayu/blob/main/SECURITY.md).
        Please remove secrets (API keys, tokens) from any config or output you paste.

  - type: input
    id: version
    attributes:
      label: wayu version
      description: Output of `wayu --version`
      placeholder: wayu v5.0.0
    validations:
      required: true

  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - bash
        - fish
        - not shell-specific
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and install method
      placeholder: macOS 15 arm64, Homebrew
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command, its output and the exit code (`echo $?`).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Ideally starting from a clean `HOME=$(mktemp -d) wayu init`.
      placeholder: |
        1. HOME=$(mktemp -d) wayu init
        2. wayu path add ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: wayu doctor output
      description: Output of `wayu doctor` (optional, but often helps).
      render: text
