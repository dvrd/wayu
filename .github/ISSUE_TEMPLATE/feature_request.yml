name: Feature request
description: Suggest a new command, option or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work — example commands, config or output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or how other tools handle it.

  - type: dropdown
    id: shells
    attributes:
      label: Shells affected
      multiple: true
      options:
        - zsh
        - bash
        - fish
        - not shell-specific
