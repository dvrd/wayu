name: Feature request
description: Suggest a new command, option or behavior
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet, or a question about how to do something today? Start in [Discussions](https://github.com/dvrd/wayu/discussions).
        Please don't paste secrets (API keys, tokens) in examples: use placeholders.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you'd like it to work — example commands, config or output.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or how other tools handle it.

  - type: dropdown
    id: shells
    attributes:
      label: Shells affected
      multiple: true
      options:
        - zsh
        - bash
        - fish
        - not shell-specific

  - type: input
    id: version
    attributes:
      label: wayu version
      description: Output of `wayu --version` (the feature may already exist in a newer release)
      placeholder: wayu v7.0.0
