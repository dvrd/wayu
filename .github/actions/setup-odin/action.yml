name: Setup pinned Odin
description: >
  Install the Odin release pinned in .github/odin-release from the official
  odin-lang/Odin release assets, verified against the SHA-256 values in
  .github/odin-release.sha256. No third-party action, no token, no fallback:
  a missing asset or a checksum mismatch fails the job.

  Bumping Odin: change .github/odin-release and replace every line of
  .github/odin-release.sha256 (`gh release download <tag> -R odin-lang/Odin
  -p 'odin-linux-amd64-*' -p 'odin-linux-arm64-*' -p 'odin-macos-arm64-*'`,
  then `shasum -a 256`).

  Odin publishes no macOS x86_64 toolchain: the macOS Intel release binary
  is cross-compiled on an arm64 Mac (`./build_it build --target=darwin_amd64`).

runs:
  using: composite
  steps:
    - name: Install pinned Odin
      shell: bash
      run: |
        set -euo pipefail
        pin_dir="$GITHUB_WORKSPACE/.github"
        release=$(tr -d '[:space:]' < "$pin_dir/odin-release")
        if [ -z "$release" ]; then
          echo "::error::.github/odin-release is empty"
          exit 1
        fi

        # Only the runners the workflows build on (ubuntu-24.04,
        # ubuntu-24.04-arm, macos-15). Intel Macs only run binaries.
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)   platform=linux-amd64 ;;
          Linux/ARM64) platform=linux-arm64 ;;
          macOS/ARM64) platform=macos-arm64 ;;
          macOS/X64)
            echo "::error::Odin ships no macOS x86_64 toolchain; build on macos-15 with ./build_it build --target=darwin_amd64"
            exit 1 ;;
          *) echo "::error::no pinned Odin asset for $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
        esac
        asset="odin-${platform}-${release}.tar.gz"

        expected=$(awk -v a="$asset" '$2 == a { print $1 }' "$pin_dir/odin-release.sha256")
        if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::.github/odin-release.sha256 has no sha256 for $asset (bump it with .github/odin-release)"
          exit 1
        fi

        work="$RUNNER_TEMP/odin-download"
        dest="$RUNNER_TEMP/odin"
        rm -rf "$work" "$dest"
        mkdir -p "$work" "$dest"
        curl -sSfL --proto '=https' --retry 3 -o "$work/$asset" \
          "https://github.com/odin-lang/Odin/releases/download/${release}/${asset}"

        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$work/$asset" | awk '{print $1}')
        else
          actual=$(shasum -a 256 "$work/$asset" | awk '{print $1}')
        fi
        if [ "$actual" != "$expected" ]; then
          echo "::error::$asset sha256 is $actual, expected $expected"
          exit 1
        fi

        # The archive holds one top-level dir (odin-<platform>-nightly+<date>/).
        tar -xzf "$work/$asset" -C "$dest" --strip-components=1
        rm -rf "$work"
        [ -x "$dest/odin" ] || { echo "::error::$asset has no odin executable"; exit 1; }
        echo "$dest" >> "$GITHUB_PATH"

        # Odin links through the system clang. Ubuntu 24.04 images ship
        # LLVM 18 there (what laytan/setup-odin used to add to PATH).
        if [ "$RUNNER_OS" = "Linux" ]; then
          if [ -d /usr/lib/llvm-18/bin ]; then
            echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          elif ! command -v clang >/dev/null 2>&1; then
            # A runner image without clang (e.g. a slimmer arm64 image).
            BREW_PACKAGES=llvm LINK_BINS=opt/llvm/bin/clang \
              "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" clang
          fi
        fi

    - name: Show Odin version
      shell: bash
      run: odin version
